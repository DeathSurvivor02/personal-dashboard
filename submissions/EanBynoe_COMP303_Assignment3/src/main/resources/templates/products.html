<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products — Online Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Products Catalog</h1>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/sellers}">Sellers</a>
        <a th:href="@{/products}">Products</a>
        <a th:href="@{/orders}">Customer Orders</a>
    </nav>
</header>
<div class="container">
    <form class="inline-form" th:action="@{/products/add}" th:object="${newProduct}" method="post">
        <input type="number" th:field="*{productId}" placeholder="Product ID (e.g. 201)" required>
        <input type="text" th:field="*{productName}" placeholder="Product Name" required>
        <select th:field="*{category}">
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Books">Books</option>
            <option value="Home and Kitchen">Home and Kitchen</option>
        </select>
        <input type="number" step="0.01" min="0.01" th:field="*{price}" placeholder="Price ($)" required>
        <input type="number" min="0" th:field="*{stockQuantity}" placeholder="Stock Qty" required>
        <input type="number" th:field="*{sellerId}" placeholder="Seller ID" required>
        <button type="submit">Add Product</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Available</th>
            <th>Seller ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.productId}"></td>
            <td th:text="${p.productName}"></td>
            <td th:text="${p.category}"></td>
            <td th:text="${'$' + p.price}"></td>
            <td th:text="${p.stockQuantity}"></td>
            <td th:text="${p.availability ? 'In Stock' : 'Out of Stock'}"></td>
            <td th:text="${p.sellerId}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
