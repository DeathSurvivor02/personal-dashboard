<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Online Marketplace — COMP303 Assignment 3</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Online Marketplace Management System</h1>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/sellers}">Sellers</a>
        <a th:href="@{/products}">Products</a>
        <a th:href="@{/orders}">Customer Orders</a>
    </nav>
</header>
<div class="container">
    <div class="grid">
        <div class="card">
            <h3>Registered Sellers</h3>
            <div class="metric" th:text="${sellerCount}">0</div>
        </div>
        <div class="card">
            <h3>Catalog Products</h3>
            <div class="metric" th:text="${productCount}">0</div>
        </div>
        <div class="card">
            <h3>Customer Orders</h3>
            <div class="metric" th:text="${orderCount}">0</div>
        </div>
    </div>
    <div class="card">
        <h3>REST API Endpoints (Reactive WebFlux + MongoDB)</h3>
        <p style="margin-top:0.5rem; color:#94a3b8; font-size:0.9rem;">
            Sellers: <code>/api/sellers</code> | Products: <code>/api/products</code> | Orders: <code>/api/orders</code>
        </p>
    </div>
</div>
</body>
</html>
