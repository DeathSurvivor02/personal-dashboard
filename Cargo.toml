[package]
name = "personal_dashboard"
version = "0.1.0"
edition = "2021"
authors = ["DeathSurvivor02"]
description = "Personal Productivity, R&D Simulation Lab, and Task Management Command Center in 100% Rust"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
tao = "0.30.8"
wry = "0.45.0"

[[bin]]
name = "personal_dashboard"
path = "src/main.rs"

[[bin]]
name = "academic_dashboard"
path = "src/academic_desktop.rs"
